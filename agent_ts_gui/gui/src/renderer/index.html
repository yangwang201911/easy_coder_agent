<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Coder Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="titlebar">
    <span id="titlebar-name">Coder Agent</span>
    <span class="flex1"></span>
    <button id="win-min" title="Minimize">&#8722;</button>
    <button id="win-max" title="Maximize / restore"><svg width="12" height="12" viewBox="0 0 16 16" style="display:block"><rect x="2.5" y="2.5" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button id="win-close" title="Close">&#10005;</button>
  </div>
  <div id="toolbar">
    <button id="root-label" title="Click to switch / manage projects">Project</button>
    <span id="remote-label" class="hidden" title="Connected to a remote agent server. Click to change the connection."></span>
    <span class="sep"></span>
    <label>Thinking effort: <select id="effort-combo">
      <option>default</option><option>none</option><option>low</option><option>medium</option><option>high</option>
    </select></label>
    <span class="sep"></span>
    <button id="stop-btn" disabled>Stop</button>
    <button id="sp-btn" title="Show the system prompt that will be sent for the selected task type">System prompt</button>
    <button id="settings-btn">Settings</button>
  </div>

  <div id="body">
    <div id="left">
      <div id="left-tabs">
        <button class="tab active" data-tab="turns">Turns</button>
        <button class="tab" data-tab="sessions">Chat</button>
        <button class="tab" data-tab="files">Files</button>
      </div>
      <div id="left-pages">
        <div id="tab-turns" class="tabpage">
          <ul id="turn-list" class="list"></ul>
        </div>
        <div id="tab-sessions" class="tabpage hidden">
          <div id="session-list-view">
            <button id="new-session-btn" class="wide">New session</button>
            <ul id="session-list" class="list"></ul>
          </div>
          <div id="session-chat-view" class="hidden">
            <div id="chat-view-toolbar">
              <button id="chat-back-btn" title="Back to the sessions list">←</button>
              <span id="chat-view-title" class="muted">session</span>
              <span class="flex1"></span>
              <button id="chat-turns-btn" title="Show this session's turns" class="flat">
                <svg width="14" height="14" viewBox="0 0 16 16" style="display:block"><rect x="2" y="3" width="12" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><line x1="5" y1="6.5" x2="11" y2="6.5" stroke="currentColor" stroke-width="1.2"/><line x1="5" y1="9.5" x2="9" y2="9.5" stroke="currentColor" stroke-width="1.2"/></svg>
              </button>
            </div>
            <div id="chat" class="log"></div>
          </div>
          <!-- always visible at the bottom of the sessions tab (list view and
               chat view); sending from the list view starts a new session -->
          <div id="input-resize" title="Drag up to enlarge the input box, double-click to reset"></div>
          <div id="input-zone">
            <div id="file-attach-tag" class="hidden"></div>
            <div id="attach-strip" class="hidden"></div>
            <div id="input-card">
              <textarea id="input" placeholder="Describe what to build...  (Enter to send, Ctrl+Enter for newline, paste images to attach)"></textarea>
              <div id="send-row">
                <button id="attach-btn" title="Insert a file's content into the prompt">＋</button>
                <button id="image-btn" title="Attach images (or paste screenshots)">🖼</button>
                <button id="mode-combo-btn" title="Agent mode: single agent / plan &amp; subtasks">
                  <svg width="13" height="13" viewBox="0 0 16 16" style="display:block"><path d="M8 1.5 L14 13 L8 10.2 L2 13 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                  <span id="mode-combo-label">Agent</span>
                </button>
                <button id="model-combo" title="Current model &amp; context (click for Settings)">model</button>
                <span class="flex1"></span>
                <button id="send-btn" title="Send (Enter)">
                  <svg width="14" height="14" viewBox="0 0 16 16" style="display:block"><path d="M8 13 V3 M3.5 7.5 L8 3 L12.5 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
            <div id="input-foot-row">
              <button id="conn-mode-label" class="flat" title="Connection mode (click for Settings)">
                <svg width="13" height="13" viewBox="0 0 16 16" style="display:block"><rect x="2" y="3.5" width="12" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/><line x1="5.5" y1="14" x2="10.5" y2="14" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
                <span id="conn-mode-text">Local</span>
              </button>
              <button id="approval-label" class="flat" title="Approval policy (click for Settings)">
                <svg width="13" height="13" viewBox="0 0 16 16" style="display:block"><path d="M8 1.8 L13.4 3.8 V8 C13.4 11.2 11.2 13.3 8 14.4 C4.8 13.3 2.6 11.2 2.6 8 V3.8 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
                <span id="approval-text">Default permissions</span>
              </button>
            </div>
          </div>
        </div>
        <div id="tab-files" class="tabpage hidden">
          <div id="tree-toolbar">
            <button id="tree-refresh-btn" title="Reload the tree">⟳</button>
            <span class="muted">project files</span>
            <span class="flex1"></span>
            <input id="web-url-input" type="text" placeholder="http://localhost:8000/" title="Open a local web page in a browser tab" />
            <button id="web-open-btn" title="Open the web page above in a browser tab">🌐</button>
          </div>
          <div id="file-tree"></div>
        </div>
      </div>
    </div>

    <div class="splitter" id="split-left" title="Drag to resize, double-click to reset"></div>

    <div id="main-col">
    <div id="mid">
      <div id="file-view">
        <div id="file-tabs"></div>
        <div id="file-body" class="m"></div>
      </div>
    </div>

    <div class="splitter h" id="split-bottom" title="Drag to resize, double-click to reset"></div>

    <div id="bottom">
      <div id="right-tabs" class="bottom-tabs">
        <button class="tab active" data-tab="activity">Activity</button>
        <button class="tab" data-tab="plan">Plan</button>
        <button class="tab" data-tab="thinking">Thinking</button>
        <button class="tab" data-tab="commands">Commands</button>
        <button class="tab" data-tab="docs">Docs read</button>
        <button class="tab" data-tab="terminals">Terminals</button>
      </div>
      <div id="tab-activity" class="tabpage log mono"></div>
      <div id="tab-plan" class="tabpage hidden"></div>
      <div id="tab-thinking" class="tabpage log hidden"></div>
      <div id="tab-commands" class="tabpage log mono hidden"></div>
      <div id="tab-docs" class="tabpage log mono hidden"></div>
      <div id="tab-terminals" class="tabpage hidden">
        <div id="term-list-col">
          <div id="term-list-toolbar">
            <button id="term-new-btn" title="New terminal">＋</button>
            <button id="term-close-btn" class="hidden" title="Close selected terminal" disabled>✕</button>
          </div>
          <ul id="term-list" class="list"></ul>
        </div>
        <div id="term-pane"></div>
      </div>
    </div>
    </div>
  </div>

  <div id="statusbar">
    <span id="state-label">Idle</span>
    <span id="llm-label"></span>
    <button id="server-ctx-btn" class="flat" title="Context length reported by the server. Click to refresh.">server cache: ?</button>
    <div id="ctx-bar"><div id="ctx-fill"></div><span id="ctx-text">context 0</span></div>
    <span id="version-label" class="muted"></span>
  </div>

  <div id="ctxmenu"></div>
  <div id="modal-backdrop" class="modal-backdrop"><div class="modal" id="modal"></div></div>

  <script src="app.js"></script>
</body>
</html>
